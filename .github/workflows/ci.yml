name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres for the LP SQL integration tests (lpDb.integration.test.ts)
      # and for the restore probe (scripts/restore-smoke.ts, #86). Both only ever
      # touch this disposable server — never production.
      # Those tests skip themselves when DATABASE_URL is unset (e.g. local runs).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Sanfter, warn-only Start (#85): zeigt ESLint-Hinweise, blockiert aber nie
      # (alle Regeln stehen auf "warn", eslint endet mit Exit-Code 0).
      - name: ESLint (warn-only)
        run: pnpm run lint:eslint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/clearn_test

      # Echte Wiederherstellungs-Probe (#86): spielt ALLE Migrationen in eine
      # frische, leere Wegwerf-Datenbank ein und prueft, ob danach die tragenden
      # Tabellen, Funktionen und RLS-Schalter stehen. Frueher war das eine
      # Attrappe, die nur die Existenz einer Datei geprueft hat.
      - name: Restore-Probe (Wiederaufbau aus Migrationen)
        run: pnpm run restore:smoke
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/clearn_test

      # Der Produktions-Bau des Webs. `tsc` und die Tests sehen ihn NICHT: Sie
      # pruefen Typen und Logik, nicht das Vorab-Erzeugen der Seiten. Genau
      # dort brach der Bau am 31.07. — eine fehlende Suspense-Grenze auf
      # /signup legte die gesamte Auslieferung lahm, und gemerkt hat es erst
      # Vercel, also NACH dem Merge. Ein PR, der das Web kaputt macht, wird ab
      # hier sofort rot.
      #
      # Ohne Umgebungsvariablen: Alle NEXT_PUBLIC_*-Werte haben Rueckfallwerte
      # im Code (supabase-browser.ts, api.ts), der Bau braucht also keine
      # Geheimnisse — nachgestellt, indem lokal ohne .env.local gebaut wurde.
      - name: Build web (Produktions-Bau)
        run: pnpm --filter @clearn/web build

      - name: Build cloudlearn preview
        run: pnpm --filter @clearn/mobile build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test cloudlearn preview
        run: pnpm test:cloudlearn-smoke
